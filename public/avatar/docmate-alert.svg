<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="alertGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <!-- Alert Amber Ring Aura -->
  <circle cx="100" cy="100" r="94" fill="url(#alertGlow)" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="8 4"/>

  <!-- Floating Alert Shield Icon -->
  <g transform="translate(142, 28)">
    <polygon points="16,0 32,8 32,24 16,36 0,24 0,8" fill="#EF4444" stroke="#DC2626" stroke-width="2"/>
    <text x="16" y="24" fill="#FFFFFF" font-size="20" font-weight="bold" text-anchor="middle" font-family="sans-serif">!</text>
  </g>

  <!-- Body & Doctor Coat -->
  <path d="M40 185 C40 145 65 135 100 135 C135 135 160 145 160 185 Z" fill="url(#coatGrad)" stroke="#CBD5E1" stroke-width="2"/>
  <!-- Inner Scrub Shirt -->
  <polygon points="85,135 115,135 100,165" fill="url(#shirtGrad)"/>
  <!-- Coat Lapels -->
  <path d="M72 138 L94 175 L80 185" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M128 138 L106 175 L120 185" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Stethoscope -->
  <path d="M68 142 C65 170 85 182 92 182 C98 182 100 178 100 174" fill="none" stroke="#D97706" stroke-width="4" stroke-linecap="round"/>
  <path d="M132 142 C135 170 115 182 108 182 C102 182 100 178 100 174" fill="none" stroke="#D97706" stroke-width="4" stroke-linecap="round"/>
  <circle cx="92" cy="183" r="5" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>

  <!-- Neck -->
  <rect x="88" y="118" width="24" height="22" rx="4" fill="#FBCDB6"/>

  <!-- Ears -->
  <circle cx="56" cy="94" r="9" fill="#FBCDB6"/>
  <circle cx="144" cy="94" r="9" fill="#FBCDB6"/>

  <!-- Head Base -->
  <ellipse cx="100" cy="92" rx="42" ry="45" fill="#FDE2D2"/>

  <!-- Hair -->
  <path d="M58 84 C56 60 72 45 100 45 C128 45 144 60 142 84 C134 70 120 66 100 66 C78 66 65 72 58 84 Z" fill="#1E293B"/>

  <!-- Eyebrows (Serious Alert Inward slant) -->
  <path d="M72 79 C78 78 84 81 88 83" fill="none" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>
  <path d="M112 83 C116 81 122 78 128 79" fill="none" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>

  <!-- Eyes (Serious, Focused) -->
  <ellipse cx="80" cy="90" rx="4.5" ry="5.5" fill="#0F172A"/>
  <circle cx="78.5" cy="88" r="1.6" fill="#FFFFFF"/>
  <ellipse cx="120" cy="90" rx="4.5" ry="5.5" fill="#0F172A"/>
  <circle cx="118.5" cy="88" r="1.6" fill="#FFFFFF"/>

  <!-- Cheeks Blush -->
  <ellipse cx="70" cy="99" rx="6" ry="3.5" fill="#EF4444" opacity="0.25"/>
  <ellipse cx="130" cy="99" rx="6" ry="3.5" fill="#EF4444" opacity="0.25"/>

  <!-- Nose -->
  <path d="M99 92 C98 96 100 99 103 99" fill="none" stroke="#E29D80" stroke-width="2" stroke-linecap="round"/>

  <!-- Serious Mouth Line -->
  <path d="M90 110 L110 110" stroke="#991B1B" stroke-width="3" stroke-linecap="round"/>
</svg>
