<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="understoodGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>

  <!-- Aura -->
  <circle cx="100" cy="100" r="92" fill="url(#understoodGlow)" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.7"/>

  <!-- Body & Doctor Coat -->
  <path d="M40 185 C40 145 65 135 100 135 C135 135 160 145 160 185 Z" fill="url(#coatGrad)" stroke="#CBD5E1" stroke-width="2"/>
  <!-- Inner Scrub Shirt -->
  <polygon points="85,135 115,135 100,165" fill="url(#shirtGrad)"/>
  <!-- Coat Lapels -->
  <path d="M72 138 L94 175 L80 185" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M128 138 L106 175 L120 185" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Stethoscope -->
  <path d="M68 142 C65 170 85 182 92 182 C98 182 100 178 100 174" fill="none" stroke="#0284C7" stroke-width="4" stroke-linecap="round"/>
  <path d="M132 142 C135 170 115 182 108 182 C102 182 100 178 100 174" fill="none" stroke="#0284C7" stroke-width="4" stroke-linecap="round"/>
  <circle cx="92" cy="183" r="5" fill="#E2E8F0" stroke="#0284C7" stroke-width="2"/>

  <!-- Neck (Slightly lowered in receptive nod) -->
  <rect x="88" y="119" width="24" height="21" rx="4" fill="#FBCDB6"/>

  <!-- Ears -->
  <circle cx="56" cy="95" r="9" fill="#FBCDB6"/>
  <circle cx="144" cy="95" r="9" fill="#FBCDB6"/>

  <!-- Head Base (Nod position) -->
  <ellipse cx="100" cy="93" rx="42" ry="45" fill="#FDE2D2"/>

  <!-- Hair -->
  <path d="M58 85 C56 61 72 46 100 46 C128 46 144 61 142 85 C134 71 120 67 100 67 C78 67 65 73 58 85 Z" fill="#1E293B"/>

  <!-- Eyebrows (Relaxed & Understanding) -->
  <path d="M72 79 C76 77 83 77 87 79" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M113 79 C117 77 124 77 128 79" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Eyes (Serene Satisfied Closed Curves ^ ^) -->
  <path d="M74 89 C78 83 86 83 90 89" fill="none" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
  <path d="M110 89 C114 83 122 83 126 89" fill="none" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>

  <!-- Subtle Nod ripple lines above head -->
  <path d="M92 40 C97 37 103 37 108 40" fill="none" stroke="#0284C7" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>

  <!-- Cheeks Blush -->
  <ellipse cx="69" cy="98" rx="6.5" ry="3.5" fill="#F43F5E" opacity="0.25"/>
  <ellipse cx="131" cy="98" rx="6.5" ry="3.5" fill="#F43F5E" opacity="0.25"/>

  <!-- Nose -->
  <path d="M99 91 C98 95 100 98 103 98" fill="none" stroke="#E29D80" stroke-width="2" stroke-linecap="round"/>

  <!-- Knowing, Confident Gentle Smile -->
  <path d="M88 108 C94 114 106 114 112 108" fill="none" stroke="#BE123C" stroke-width="2.8" stroke-linecap="round"/>
</svg>
