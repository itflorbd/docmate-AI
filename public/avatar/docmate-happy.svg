<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="happyGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Happy Aura -->
  <circle cx="100" cy="100" r="92" fill="url(#happyGlow)"/>

  <!-- Success Sparkle / Checkmark -->
  <g transform="translate(150, 32)">
    <circle cx="14" cy="14" r="14" fill="#10B981"/>
    <path d="M8 14 L12 18 L20 10" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Body & Doctor Coat -->
  <path d="M40 185 C40 145 65 135 100 135 C135 135 160 145 160 185 Z" fill="url(#coatGrad)" stroke="#CBD5E1" stroke-width="2"/>
  <!-- Inner Scrub Shirt -->
  <polygon points="85,135 115,135 100,165" fill="url(#shirtGrad)"/>
  <!-- Coat Lapels -->
  <path d="M72 138 L94 175 L80 185" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M128 138 L106 175 L120 185" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Stethoscope -->
  <path d="M68 142 C65 170 85 182 92 182 C98 182 100 178 100 174" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
  <path d="M132 142 C135 170 115 182 108 182 C102 182 100 178 100 174" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
  <circle cx="92" cy="183" r="5" fill="#A7F3D0" stroke="#059669" stroke-width="2"/>

  <!-- Neck -->
  <rect x="88" y="118" width="24" height="22" rx="4" fill="#FBCDB6"/>

  <!-- Ears -->
  <circle cx="56" cy="94" r="9" fill="#FBCDB6"/>
  <circle cx="144" cy="94" r="9" fill="#FBCDB6"/>

  <!-- Head Base -->
  <ellipse cx="100" cy="92" rx="42" ry="45" fill="#FDE2D2"/>

  <!-- Hair -->
  <path d="M58 84 C56 60 72 45 100 45 C128 45 144 60 142 84 C134 70 120 66 100 66 C78 66 65 72 58 84 Z" fill="#1E293B"/>

  <!-- Joyful Curved Closed Eyes (^ ^) -->
  <path d="M73 88 C77 82 85 82 89 88" fill="none" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
  <path d="M111 88 C115 82 123 82 127 88" fill="none" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>

  <!-- Happy Cheeks Blush -->
  <ellipse cx="68" cy="96" rx="7" ry="4" fill="#F43F5E" opacity="0.35"/>
  <ellipse cx="132" cy="96" rx="7" ry="4" fill="#F43F5E" opacity="0.35"/>

  <!-- Nose -->
  <path d="M99 90 C98 94 100 97 103 97" fill="none" stroke="#E29D80" stroke-width="2" stroke-linecap="round"/>

  <!-- Wide Happy Grin -->
  <path d="M84 105 C92 118 108 118 116 105 Z" fill="#BE123C"/>
  <path d="M90 106 C96 110 104 110 110 106 Z" fill="#FFFFFF"/>
</svg>
