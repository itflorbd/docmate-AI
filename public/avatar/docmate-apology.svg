<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="apologyGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Aura -->
  <circle cx="100" cy="100" r="92" fill="url(#apologyGlow)" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Body & Doctor Coat (Slightly tilted forward in polite bow) -->
  <path d="M40 185 C40 145 65 136 100 136 C135 136 160 145 160 185 Z" fill="url(#coatGrad)" stroke="#CBD5E1" stroke-width="2"/>
  <!-- Inner Scrub Shirt -->
  <polygon points="85,136 115,136 100,166" fill="url(#shirtGrad)"/>
  <!-- Coat Lapels -->
  <path d="M72 139 L94 176 L80 186" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M128 139 L106 176 L120 186" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Stethoscope -->
  <path d="M68 143 C65 171 85 183 92 183 C98 183 100 179 100 175" fill="none" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <path d="M132 143 C135 171 115 183 108 183 C102 183 100 179 100 175" fill="none" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <circle cx="92" cy="184" r="5" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>

  <!-- Neck (Slight forward polite bow) -->
  <rect x="88" y="120" width="24" height="21" rx="4" fill="#FBCDB6"/>

  <!-- Ears -->
  <circle cx="56" cy="96" r="9" fill="#FBCDB6"/>
  <circle cx="144" cy="96" r="9" fill="#FBCDB6"/>

  <!-- Head Base (Lowered for respectful bow) -->
  <ellipse cx="100" cy="94" rx="42" ry="45" fill="#FDE2D2"/>

  <!-- Hair -->
  <path d="M58 86 C56 62 72 47 100 47 C128 47 144 62 142 86 C134 72 120 68 100 68 C78 68 65 74 58 86 Z" fill="#1E293B"/>

  <!-- Eyebrows (Apologetic / Humble tilt) -->
  <path d="M72 77 C77 80 84 81 88 80" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M112 80 C116 81 123 80 128 77" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Eyes (Humble Downcast / Soft curved ^ ^) -->
  <ellipse cx="80" cy="91" rx="4" ry="4.5" fill="#0F172A"/>
  <circle cx="78.5" cy="89.5" r="1.4" fill="#FFFFFF"/>
  <ellipse cx="120" cy="91" rx="4" ry="4.5" fill="#0F172A"/>
  <circle cx="118.5" cy="89.5" r="1.4" fill="#FFFFFF"/>

  <!-- Cheeks Blush (Modest apology blush) -->
  <ellipse cx="70" cy="99" rx="6" ry="3.5" fill="#F43F5E" opacity="0.28"/>
  <ellipse cx="130" cy="99" rx="6" ry="3.5" fill="#F43F5E" opacity="0.28"/>

  <!-- Nose -->
  <path d="M99 92 C98 96 100 99 103 99" fill="none" stroke="#E29D80" stroke-width="2" stroke-linecap="round"/>

  <!-- Humble Soft Curved Line Mouth -->
  <path d="M90 108 C96 111 104 111 110 108" fill="none" stroke="#BE123C" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Hands folded gently in front in humility -->
  <ellipse cx="100" cy="172" rx="14" ry="9" fill="#FBCDB6" stroke="#CBD5E1" stroke-width="1.5"/>
</svg>
