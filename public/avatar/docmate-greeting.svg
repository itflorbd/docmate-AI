<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="greetGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
  </defs>

  <!-- Welcoming Glow Aura -->
  <circle cx="100" cy="100" r="92" fill="url(#greetGlow)" stroke="#0D9488" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8"/>

  <!-- Body & Doctor Coat -->
  <path d="M40 185 C40 145 65 135 100 135 C135 135 160 145 160 185 Z" fill="url(#coatGrad)" stroke="#CBD5E1" stroke-width="2"/>
  <!-- Inner Scrub Shirt -->
  <polygon points="85,135 115,135 100,165" fill="url(#shirtGrad)"/>
  <!-- Coat Lapels -->
  <path d="M72 138 L94 175 L80 185" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M128 138 L106 175 L120 185" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Stethoscope -->
  <path d="M68 142 C65 170 85 182 92 182 C98 182 100 178 100 174" fill="none" stroke="#0284C7" stroke-width="4" stroke-linecap="round"/>
  <path d="M132 142 C135 170 115 182 108 182 C102 182 100 178 100 174" fill="none" stroke="#0284C7" stroke-width="4" stroke-linecap="round"/>
  <circle cx="92" cy="183" r="5" fill="#E2E8F0" stroke="#0284C7" stroke-width="2"/>

  <!-- Waving Arm & Hand (Right Side) -->
  <path d="M148 165 C162 150 176 128 172 102 C170 94 162 96 158 106 C152 120 142 142 138 155" fill="url(#coatGrad)" stroke="#CBD5E1" stroke-width="2"/>
  <ellipse cx="170" cy="98" rx="8" ry="10" fill="#FBCDB6"/>
  <!-- Friendly Waving Thumb and Fingers -->
  <circle cx="163" cy="95" r="3.5" fill="#FBCDB6"/>
  <circle cx="170" cy="90" r="3.2" fill="#FBCDB6"/>
  <circle cx="176" cy="93" r="3.2" fill="#FBCDB6"/>
  <!-- Wave motion lines -->
  <path d="M182 86 C186 92 186 98 182 104" fill="none" stroke="#0D9488" stroke-width="2" stroke-linecap="round"/>
  <path d="M187 88 C192 94 192 100 187 106" fill="none" stroke="#0D9488" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Neck -->
  <rect x="88" y="118" width="24" height="22" rx="4" fill="#FBCDB6"/>

  <!-- Ears -->
  <circle cx="56" cy="94" r="9" fill="#FBCDB6"/>
  <circle cx="144" cy="94" r="9" fill="#FBCDB6"/>

  <!-- Head Base -->
  <ellipse cx="100" cy="92" rx="42" ry="45" fill="#FDE2D2"/>

  <!-- Hair -->
  <path d="M58 84 C56 60 72 45 100 45 C128 45 144 60 142 84 C134 70 120 66 100 66 C78 66 65 72 58 84 Z" fill="#1E293B"/>

  <!-- Eyebrows (Warm & Raised) -->
  <path d="M72 76 C76 72 84 72 88 75" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M112 75 C116 72 124 72 128 76" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Eyes (Warm Sparkling Open) -->
  <ellipse cx="80" cy="87" rx="5" ry="6" fill="#0F172A"/>
  <circle cx="78" cy="85" r="2.2" fill="#FFFFFF"/>
  <circle cx="82" cy="89" r="1.0" fill="#FFFFFF"/>
  <ellipse cx="120" cy="87" rx="5" ry="6" fill="#0F172A"/>
  <circle cx="118" cy="85" r="2.2" fill="#FFFFFF"/>
  <circle cx="122" cy="89" r="1.0" fill="#FFFFFF"/>

  <!-- Cheeks Blush -->
  <ellipse cx="68" cy="97" rx="7" ry="4" fill="#F43F5E" opacity="0.32"/>
  <ellipse cx="132" cy="97" rx="7" ry="4" fill="#F43F5E" opacity="0.32"/>

  <!-- Nose -->
  <path d="M99 90 C98 94 100 97 103 97" fill="none" stroke="#E29D80" stroke-width="2" stroke-linecap="round"/>

  <!-- Warm Welcoming Smile -->
  <path d="M85 106 C92 116 108 116 115 106" fill="none" stroke="#BE123C" stroke-width="3" stroke-linecap="round"/>
</svg>
