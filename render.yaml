# Render Infrastructure Blueprint Specification
# DocMate AI (Web Service + Managed PostgreSQL with pgvector)
# Docs: https://render.com/docs/blueprint-spec

version: "1"

services:
  - type: web
    name: docmate-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: singapore
    healthCheckPath: /bn/login
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: docmate-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: PATIENT_ENCRYPTION_KEY
        generateValue: true
      - key: DOCMATE_DEMO_MODE
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "true"
      # This Render blueprint is a synthetic demo. Remove all four demo keys for real patients.
      - key: ALLOW_DEMO_IN_PRODUCTION
        value: "true"
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_EMBED_MODEL
        value: text-embedding-3-small
      - key: BD_SMS_GATEWAY_API_KEY
        sync: false

databases:
  - name: docmate-db
    databaseName: docmate
    user: docmate_admin
    plan: starter
    region: singapore
    postgresMajorVersion: "16"
